; ESP32 + CJMCU-811 (CCS811) -> ECS IoT por MQTT
; Antes de compilar: copia include/config.example.h a include/config.h y complétalo.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; PlatformIO detecta el puerto solo; fíjalo si tienes varios (ej. COM7 o /dev/ttyUSB0)
; upload_port = COM7
; monitor_port = COM7
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit CCS811 Library
    tzapu/WiFiManager
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^6.21.5
